[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "furnacepi"
version = "0.1.0"
description = "Raspberry Pi furnace experiment controller"
requires-python = ">=3.11"
dependencies = [
  "pyvisa>=1.14",
  "pyvisa-py>=0.7",
  "pyserial>=3.5",
  "gpiozero>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
furnacepi = "furnacepi.main:main"
furnacepi-preflight = "furnacepi.preflight:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
